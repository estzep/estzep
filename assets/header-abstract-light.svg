<svg xmlns="http://www.w3.org/2000/svg" width="760" height="236" viewBox="0 0 760 236" role="img" aria-labelledby="title desc">
  <title id="title">Diego Zepeda</title>
  <desc id="desc">Full Stack Software Engineer. Cofounder of Qarta Online.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfb"/>
      <stop offset="0.46" stop-color="#d9f3ee"/>
      <stop offset="1" stop-color="#e7eefc"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>
  <style>
    .blob {
      transform-box: fill-box;
      transform-origin: center;
    }
    .b1 { animation: drift1 18s ease-in-out infinite alternate; }
    .b2 { animation: drift2 22s ease-in-out infinite alternate; }
    .b3 { animation: drift3 16s ease-in-out infinite alternate; }
    .b4 { animation: drift4 20s ease-in-out infinite alternate; }
    @keyframes drift1 {
      from { transform: translate(0px, 0px); }
      to { transform: translate(34px, 16px); }
    }
    @keyframes drift2 {
      from { transform: translate(0px, 0px); }
      to { transform: translate(-28px, -18px); }
    }
    @keyframes drift3 {
      from { transform: translate(0px, 0px); }
      to { transform: translate(22px, 20px); }
    }
    @keyframes drift4 {
      from { transform: translate(0px, 0px); }
      to { transform: translate(-18px, 14px); }
    }

    .reveal-a { animation: type-a 12s infinite; }
    .reveal-b { animation: type-b 12s infinite; }
    .caret-a, .caret-b {
      transform-box: fill-box;
      transform-origin: left center;
    }
    .caret-a { animation: move-a 12s infinite, blink 1s step-end infinite; }
    .caret-b-gate { animation: gate-b 12s linear infinite; }
    .caret-b { animation: move-b 12s infinite, blink 1s step-end infinite; }
    @keyframes type-a {
      0% { width: 0; animation-timing-function: steps(28, end); }
      34% { width: 386.41px; animation-timing-function: linear; }
      90% { width: 386.41px; animation-timing-function: linear; }
      100% { width: 0; }
    }
    @keyframes type-b {
      0%, 38% { width: 0; animation-timing-function: steps(25, end); }
      68% { width: 345.02px; animation-timing-function: linear; }
      90% { width: 345.02px; animation-timing-function: linear; }
      100% { width: 0; }
    }
    @keyframes move-a {
      0% { transform: translateX(0); animation-timing-function: steps(28, end); }
      34% { transform: translateX(386.41px); animation-timing-function: linear; }
      90% { transform: translateX(386.41px); animation-timing-function: linear; }
      100% { transform: translateX(0); }
    }
    @keyframes move-b {
      0%, 38% { transform: translateX(0); animation-timing-function: steps(25, end); }
      68% { transform: translateX(345.02px); animation-timing-function: linear; }
      90% { transform: translateX(345.02px); animation-timing-function: linear; }
      100% { transform: translateX(0); }
    }
    @keyframes gate-b {
      0%, 37% { opacity: 0; }
      38%, 90% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes blink {
      0%, 45% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .blob, .reveal-a, .reveal-b, .caret-a, .caret-b, .caret-b-gate { animation: none; }
      .caret-a, .caret-b, .caret-b-gate { opacity: 0; }
    }
  </style>
  <rect width="760" height="236" rx="22" fill="url(#bg)"/>
  <g filter="url(#soft)">
    <circle class="blob b1" cx="150" cy="48" r="78" fill="#5eead4" opacity="0.55"/>
    <circle class="blob b2" cx="600" cy="176" r="96" fill="#93c5fd" opacity="0.50"/>
    <circle class="blob b3" cx="390" cy="28" r="54" fill="#fde68a" opacity="0.40"/>
    <circle class="blob b4" cx="210" cy="196" r="64" fill="#c4b5fd" opacity="0.38"/>
  </g>
  <text x="380" y="86" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="700">Diego Zepeda</text>
  <clipPath id="clip-a">
    <rect class="reveal-a" x="186.8" y="114" width="386.41" height="34"/>
  </clipPath>
  <clipPath id="clip-b">
    <rect class="reveal-b" x="186.8" y="156" width="345.02" height="34"/>
  </clipPath>
  <text x="186.8" y="142" clip-path="url(#clip-a)" fill="#1e293b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="23" textLength="386.41" lengthAdjust="spacingAndGlyphs">Full Stack Software Engineer</text>
  <text x="186.8" y="184" clip-path="url(#clip-b)" fill="#1e293b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="23" textLength="345.02" lengthAdjust="spacingAndGlyphs">Cofounder of Qarta Online</text>
  <rect class="caret caret-a" x="186.8" y="122" width="2" height="22" fill="#0f766e" opacity="0"/>
  <g class="caret-b-gate" opacity="0">
    <rect class="caret caret-b" x="186.8" y="164" width="2" height="22" fill="#0f766e" opacity="0"/>
  </g>
</svg>
