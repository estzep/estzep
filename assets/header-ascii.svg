  <ellipse class="glow-blob" cx="490" cy="58" rx="320" ry="46" fill="#1BE453" opacity="0.28" filter="url(#soft)"/>
  <text class="ascii" x="116.2" y="28" xml:space="preserve">██████╗ ██╗███████╗ ██████╗  ██████╗     ███████╗███████╗██████╗ ███████╗██████╗  █████╗ </text>
