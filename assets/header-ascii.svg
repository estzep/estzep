  <text class="ascii" x="116.2" y="73" xml:space="preserve">██║  ██║██║██╔══╝  ██║   ██║██║   ██║     ███╔╝  ██╔══╝  ██╔═══╝ ██╔══╝  ██║  ██║██╔══██║</text>
