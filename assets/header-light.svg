<svg xmlns="http://www.w3.org/2000/svg" width="680" height="164" viewBox="0 0 680 164" role="img" aria-labelledby="title desc">
  <title id="title">Diego Zepeda</title>
  <desc id="desc">Full Stack Software Engineer. Cofounder of Qarta Online.</desc>
  <style>
    .reveal-a { animation: type-a 12s infinite; }
    .reveal-b { animation: type-b 12s infinite; }
    .caret-a {
      animation: move-a 12s infinite, blink 1s step-end infinite;
      transform-box: fill-box;
      transform-origin: left center;
    }
    .caret-b-gate { animation: gate-b 12s linear infinite; }
    .caret-b {
      animation: move-b 12s infinite, blink 1s step-end infinite;
      transform-box: fill-box;
      transform-origin: left center;
    }
    @keyframes type-a {
      0% { width: 0; animation-timing-function: steps(28, end); }
      34% { width: 386.41px; animation-timing-function: linear; }
      90% { width: 386.41px; animation-timing-function: linear; }
      100% { width: 0; }
    }
    @keyframes type-b {
      0%, 38% { width: 0; animation-timing-function: steps(25, end); }
      68% { width: 345.02px; animation-timing-function: linear; }
      90% { width: 345.02px; animation-timing-function: linear; }
      100% { width: 0; }
    }
    @keyframes move-a {
      0% { transform: translateX(0); animation-timing-function: steps(28, end); }
      34% { transform: translateX(386.41px); animation-timing-function: linear; }
      90% { transform: translateX(386.41px); animation-timing-function: linear; }
      100% { transform: translateX(0); }
    }
    @keyframes move-b {
      0%, 38% { transform: translateX(0); animation-timing-function: steps(25, end); }
      68% { transform: translateX(345.02px); animation-timing-function: linear; }
      90% { transform: translateX(345.02px); animation-timing-function: linear; }
      100% { transform: translateX(0); }
    }
    @keyframes gate-b {
      0%, 37% { opacity: 0; }
      38%, 90% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes blink {
      0%, 45% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal-a, .reveal-b, .caret-a, .caret-b, .caret-b-gate { animation: none; }
      .caret-a, .caret-b, .caret-b-gate { opacity: 0; }
    }
  </style>
  <text id="title-text" x="340" y="52" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="700">Diego Zepeda</text>
  <clipPath id="clip-a">
    <rect class="reveal-a" x="146.8" y="70" width="386.41" height="34"/>
  </clipPath>
  <clipPath id="clip-b">
    <rect class="reveal-b" x="146.8" y="112" width="345.02" height="34"/>
  </clipPath>
  <text x="146.8" y="98" clip-path="url(#clip-a)" fill="#1e293b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="23" textLength="386.41" lengthAdjust="spacingAndGlyphs">Full Stack Software Engineer</text>
  <text x="146.8" y="140" clip-path="url(#clip-b)" fill="#1e293b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="23" textLength="345.02" lengthAdjust="spacingAndGlyphs">Cofounder of Qarta Online</text>
  <rect class="caret caret-a" x="146.8" y="78" width="2" height="22" fill="#0f766e" opacity="0"/>
  <g class="caret-b-gate" opacity="0">
    <rect class="caret caret-b" x="146.8" y="120" width="2" height="22" fill="#0f766e" opacity="0"/>
  </g>
</svg>
